stages:
  preprocess:
    cmd: python src/preprocessing.py
    deps:
    - data/raw/angiografia_dataset_1000.csv
    - src/preprocessing.py
    outs:
    - data/processed/angiografia_clean.csv

  evaluate:
    cmd: echo "Evaluation completed"
    deps:
    - models/best_model.pkl
    metrics:
    - results/metrics.json:
        cache: false
